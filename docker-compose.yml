services:
  # 1. MongoDB
  the-nest:
    image: mongo:latest
    container_name: magpie-nest
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - TZ=Asia/Seoul
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    command: ["mongod", "--config", "/etc/mongo/mongod.conf"]
    volumes:
      - nest-data:/data/db
      - ./mongo/mongod.conf:/etc/mongo/mongod.conf:ro
    restart: always

  # 2. Redis
  hamster-wheel:
    image: redis:alpine
    container_name: hamster-wheel
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - TZ=Asia/Seoul
    restart: always

volumes:
  nest-data:
